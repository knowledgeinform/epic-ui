<div *ngIf="!fetching && dataSource.data.length>0">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle matTreeNodePadding>
    <button mat-icon-button disabled></button>
    <mat-checkbox class="checklist-leaf-node"
            [checked]="checklistSelection.isSelected(node)"
            (change)="leafItemSelectionToggle(node)">{{node.name}}</mat-checkbox>
    </mat-tree-node>
    <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
      <button mat-icon-button matTreeNodeToggle
          [attr.aria-label]="'toggle ' + node.filename">
        <mat-icon class="mat-icon-rtl-mirror">
        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
        </mat-icon>
      </button>
      <mat-checkbox [checked]="descendantsAllSelected(node)"
              [indeterminate]="descendantsPartiallySelected(node)"
              (change)="itemSelectionToggle(node)" class="mat-checkbox-inner-container-fix">
          {{node.name}}
      </mat-checkbox>
    </mat-tree-node>
  </mat-tree>
</div>
<div *ngIf="!fetching && showNotValidatedOnly && dataSource.data.length===0">
  <div *ngIf="redBlackLineComments" >
    <span *ngIf = "!findCommentsForRole; else findCommentsBlock">
      <p>No unsigned comments found for the selected role.</p>
    </span>
    <ng-template #findCommentsBlock>
      <p>All {{redLines ? "Red" : "Black"}} Line Comments for the selected role have been signed.</p>
    </ng-template>
  </div>
</div>
<div *ngIf="!redBlackLineComments && noStepsToManuallyValidate && showNotValidatedOnly">
  <p>All groups/steps have been validated.</p>
</div>
