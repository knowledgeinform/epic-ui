<h2>Edit Required Roles</h2>

<div mat-dialog-content>
  <p>Select the roles that should be required on this program.</p>

  <ng-container *ngIf="allProgramRoles; else loadingSpinnerTemplate">
    <p *ngFor="let role of allProgramRoles">
      <mat-checkbox
        [checked]="role.name | programRoleIsMet: selectedProgramRoles"
        (change)="onCheckboxChange(role, $event.checked)"
      >{{role.name}}</mat-checkbox>
    </p>
  </ng-container>
  <ng-template #loadingSpinnerTemplate>
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </ng-template>
</div>

<div mat-dialog-actions>
  <button
    mat-raised-button
    (click)="cancel()"
  >Cancel</button>
  <button
    mat-raised-button
    color="primary"
    (click)="save()"
  >Save</button>
</div>
