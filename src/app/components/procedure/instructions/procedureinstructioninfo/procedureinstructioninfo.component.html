<mat-expansion-panel [ngClass]="(instruction?.editType !== 'RUN' && instruction?.editType !== 'ORIGINAL' && instruction?.editType !== 'LOCKED_RUN') ? 'red-line-background' : ''"
                      [expanded]="isExpand" [disabled]="editingHeader">
  <mat-expansion-panel-header class="overrideHeaderStyle">
    <mat-panel-title class="overrideDisableStyle">
      <ng-content select="[slot=drag-handle]"></ng-content>
      <button mat-icon-button [matMenuTriggerFor]="instrInfoActionMenu" [matMenuTriggerData]="{id: instruction.pk, name: instruction.sectionName}" (onMenuOpen)="instrInfoMenuDisplay=true"
              (onMenuClose)="instrInfoMenuDisplay=false" (click)="$event.stopPropagation()" class="instr-info-icon-align" *ngIf="(!isReadonly && !runPk) || redliningEnabled" matTooltip="Click here for instruction info actions.">
        <mat-icon>settings</mat-icon>
      </button>
      <mat-icon *ngIf="instruction?.editType === 'REDLINE_DELETE'" class="red-line" matTooltip="This is a red line deletion">delete_forever</mat-icon>
      <mat-icon *ngIf="instruction?.editType === 'REDLINE_ADD'" class="red-line" matTooltip="This is a red line addition">add_box</mat-icon>
      <mat-icon *ngIf="instruction?.editType === 'REDLINE_EDIT'" class="red-line" matTooltip="This is a red line edit">create</mat-icon>
      <mat-form-field class="sectionHeader">
        <input matInput type="text"
                [readonly]="isReadonly || (!redliningEnabled && runPk) || printMode"
                (focus)="editingHeader=true"
                (focusout)="editingHeader=false"
                (keydown)="$event.stopPropagation()"
                [(ngModel)]="sectionName"
                [ngClass]="instruction?.editType === 'REDLINE_DELETE' ? 'deletion-strikethrough' : ''"
                [ngModelOptions]="{standalone: true}" maxlength="100"
                (change)="updateSectionName(sectionName)"
        />
        <span matPrefix *ngIf="instruction.editType !== 'REDLINE_DELETE'">{{instruction.displayOrder}}.&nbsp;</span>
        <mat-hint align="end" *ngIf="!isReadonly || redliningEnabled">{{instruction.sectionName?.length || 0}}/100</mat-hint>
      </mat-form-field>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <!-- Editable Instruction Info -->
  <div *ngIf="(!isReadonly && !printMode) || redliningEnabled">
    <app-summernote-editor [text]="sectionText" (textChange)="receiveTextChange($event)" required >
    </app-summernote-editor>
    <div style="text-align: right">
      <button mat-raised-button color="primary" (click)="saveSection(instruction)"
              id="instructionInformationSaveSections" >
        <mat-icon>save</mat-icon>
        Save
      </button></div>
  </div>
  <div *ngIf="(isReadonly && !redliningEnabled) || printMode">
    <div [ngxSummernoteView]=sectionText></div>
  </div>

  <!--</mat-form-field>-->

  <!-- Read-only, printable instruction info -->
<!--  <p class="print-only">{{sectionText}}</p>-->

</mat-expansion-panel>

<mat-menu #instrInfoActionMenu="matMenu">
  <ng-template matMenuContent>
    <button mat-menu-item (click)="deleteSection()">Delete Section</button>
    <button mat-menu-item (click)="copySection()">Copy Section</button>
  </ng-template>
</mat-menu>
