<!-- this file contains an expansion panel which is this step group. This expansion panel contains any step and children step groups associated with this step group -->
<!-- note that the expansion panel has an id that is generated by ngInit(). DO NOT mix this up with the id of the div enclosing the app-procedurestepgroups element;
  this id is for use by the anchor functionality -->
<mat-menu #stepGroupActionMenu="matMenu">
  <button
    mat-menu-item
    (click)="addSubgroup()"
    id="addNewSubgroupButton"
    aria-label="Add a new subgroup"
  >Add New Subgroup
  </button>
  <button
    mat-menu-item
    (click)="addStep()"
    aria-label="Add a new step"
    id="addNewStepButton"
  >Add New Step
  </button>
  <button
    mat-menu-item
    matTooltip="This selection moves group either within this group or to another group"
    aria-label="Move this step group to a new position in this group or to another group"
    (click)="moveStepGroup()"
    id="moveStepGroupButton"
  >Move Step Group
  </button>
  <button
    mat-menu-item
    (click)="deleteStepGroup()"
    id="deleteStepGroupButton"
    aria-label="Delete this step group"
  >Delete Step Group
  </button>
  <button
    mat-menu-item
    (click)="copyStepGroup()"
    id="copyStepGroupButton"
    aria-label="Copy this step group"
  >Copy Step Group
  </button>
</mat-menu>
<mat-expansion-panel
  [disabled]="stepGroupMenuDisplay"
  [ngClass]="(stepGroup?.editType !== EditType.RUN && stepGroup?.editType !== EditType.ORIGINAL && stepGroup?.editType !== EditType.LOCKED_RUN) ? 'red-line-background' : 'group-panel-content'"
  id="{{idName}}"
  [expanded]="stepGroup?.editType === EditType.REDLINE_DELETE ? false : expandThis"
  (closed)="collapseAllChildren()"
  (click)="toggleExpandThis($event)"
  (opened)="panelOpenState = true"
>
  <mat-expansion-panel-header class="overrideHeaderStyle">
    <mat-panel-title>
      <!-- this bit makes a connection to the drag handle element under the app-procedurestepgroups element. This allows users to drag groups around under the
          drag handle, and limits dragging to just the area of the drag handle-->
      <ng-content select="[slot=drag-handle]"></ng-content>
      <button
        mat-icon-button
        [matMenuTriggerFor]="stepGroupActionMenu"
        (onMenuOpen)="stepGroupMenuDisplay=true"
        (onMenuClose)="stepGroupMenuDisplay=false"
        class="step-group-icon-align"
        *ngIf="(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) && stepGroup.editType !== EditType.REDLINE_DELETE && (!isReadonly || procedureData.redliningEnabled)"
        matTooltip="Click here for step group actions."
        aria-label="Click here to open the step group actions menu"
      >
        <mat-icon>settings</mat-icon>
      </button>
      <mat-icon *ngIf="stepGroup?.editType === EditType.REDLINE_DELETE"
                class="step-group-icon-align red-line"
                matTooltip="This is a red line deletion"
                aria-label="This group has been deleted as a red line action"
      >delete_forever</mat-icon>
      <mat-icon *ngIf="stepGroup?.editType === EditType.REDLINE_ADD"
                class="step-group-icon-align red-line"
                matTooltip="This is a red line addition"
                aria-label="This group has been added as a red line action"
      >add_box</mat-icon>
      <mat-icon *ngIf="stepGroup?.editType === EditType.REDLINE_EDIT"
                class="step-group-icon-align red-line"
                matTooltip="This is a red line edit"
                aria-label="This group has been edited as a red line action"
      >create</mat-icon>
      <mat-form-field class="sectionHeader">
        <input
          matInput
          type="text"
          [readonly]="!(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) || isReadonly || stepGroup.editType === EditType.REDLINE_DELETE"
          (focus)="editingHeader=true"
          (focusout)="editingHeader=false"
          (keydown)="$event.stopPropagation()"
          (keyup)="keyUp.next($event)"
          [(ngModel)]="stepGroupName"
          [ngModelOptions]="{standalone: true}"
          [ngClass]="stepGroup?.editType === EditType.REDLINE_DELETE ? 'deletion-strikethrough' : ''"
          [attr.aria-readonly]="!(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) || isReadonly || stepGroup.editType === EditType.REDLINE_DELETE"
          [attr.aria-label]="'This group name is ' + stepGroupName"
          maxlength="100"
        />
        <mat-hint
          align="end"
          *ngIf="panelOpenState"
          aria-label="The step group name can be a maximum of 100 characters"
        >{{stepGroup.stepGroupName.length || 0}}/100
        </mat-hint>
        <span matPrefix *ngIf="stepGroup.editType !== EditType.REDLINE_DELETE">{{stepGroup | stepGroupDisplayOrder : stepGroup.displayOrder}}&nbsp;&nbsp;</span>
      </mat-form-field>
      <mat-icon class="step-group-icon sticky-comment"
                *ngIf="stepGroup.runCloseoutStickyComments?.length > 0"
                matTooltip="There are closeout stickies waiting for resolution"
                aria-label="There are closeout stickies waiting for resolution"
      >
        bookmark
      </mat-icon>

      <!-- Validation icon -->
      <mat-icon
        class="step-group-icon"
        *ngIf="isValid"
        matTooltip="This step group is complete and valid."
        aria-label="This step group is complete and valid"
      >check
      </mat-icon>
    </mat-panel-title>
  </mat-expansion-panel-header>

  <ng-template matExpansionPanelContent>
    <div class="group-panel-body">
      <mat-form-field class="groupDescription">
        <mat-label>Step Group Description</mat-label>
        <textarea matInput cdkTextareaAutosize
                [readonly]="!(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) || isReadonly || stepGroup.editType === EditType.REDLINE_DELETE"
                #groupDescription
                [(ngModel)]="stepGroupDescription"
                [ngModelOptions]="{standalone: true}"
                (keyup)="keyUp.next($event)" maxlength="5000"
                  [attr.aria-label]="'This step group description is ' + stepGroupDescription"
                  [attr.aria-readonly]="!(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) || isReadonly || stepGroup.editType === EditType.REDLINE_DELETE"
        ></textarea>
        <mat-hint align="end"
                  *ngIf="!isReadonly && (procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) && stepGroup.editType !== EditType.REDLINE_DELETE"
                  aria-label="The step group description can be a maximum of 5000 characters"
        >{{groupDescription.value?.length || 0}}/5000</mat-hint>
      </mat-form-field>

      <mat-button-toggle-group *ngIf="run" [multiple]="true">
        <mat-button-toggle *ngIf="stepGroup.stepDefs?.length > 0" (change)="toggleExpandAllChildren()"
                           matTooltip="Expand/Collapse Group"
                           aria-label="Click here to expand or collapse the contents of this group"
        >
          <mat-icon
            class="step-group-icon-align"
          >storage
          </mat-icon>
        </mat-button-toggle>
        <mat-button-toggle *ngIf="stepGroup.redLineComments?.length > 0" (change)="displayGroupRedLines = $event.source.checked"
                           matTooltip="View red lines for this group."
                           [attr.aria-label]="'Click here to view the red lines for this group. This group has ' + (stepGroup.redLineComments?.length ) + ' red line comment(s)'"
        >
          <mat-icon class="step-group-icon-align red-line"
                    matBadge="{{stepGroup.redLineComments?.length > 0 ? stepGroup.redLineComments.length : null}}"
                    matBadgeColor="primary"
          >mode_comment</mat-icon>
        </mat-button-toggle>
        <mat-button-toggle *ngIf="run.status !== RunStatus.RUNNING && run.status !== RunStatus.COMPLETED"
                           (change)="displayRunCloseoutStickyComments = $event.source.checked"
                           matTooltip="View/write a run closeout sticky."
                           [attr.aria-label]="'Click here to view or write run closeout stickies for this group. This group has ' + (stepGroup.runCloseoutStickyComments.length) + ' stickies'"
        >
          <mat-icon class="step-group-icon-align sticky-comment"
                    matBadge="{{stepGroup.runCloseoutStickyComments?.length > 0 ? stepGroup.runCloseoutStickyComments.length : null}}"
                    matBadgeColor="primary">bookmark</mat-icon>
        </mat-button-toggle>
      </mat-button-toggle-group>
      <div *ngIf="displayGroupRedLines" class="detailSection">
        <div  class="comment-section-title">
          Red Lines
        </div>
        <app-line-edit-comments
          *ngFor="let comment of stepGroup.redLineComments"
          [comment]="comment" [procedureData]="procedureData"
          [isReadOnly]="isReadonly"
        >
        </app-line-edit-comments>
      </div>
      <app-run-closeout-sticky-comment
        class="detailSection"
        *ngIf="displayRunCloseoutStickyComments" [(procedureData)]="procedureData" [stepGroup]="stepGroup">
      </app-run-closeout-sticky-comment>
      <div
        class="section-list flex-column justify-around items-stretch content-stretch"
        id="s_{{stepGroup.pk}}"
        cdkDropList
        [cdkDropListData]="stepGroup.stepDefs"
        (cdkDropListDropped)="dropStep($event)"
      >
        <app-proceduresteps
          class="step-section-box"
          *ngFor="let step of stepGroup.stepDefs; trackBy stepIdentity; let i = index"
          [expandAll]="expandChildren"
          [stepGroup]="stepGroup"
          [isReadonly]="isReadonly || stepGroup.editType === EditType.REDLINE_DELETE"
          [(step)]="stepGroup.stepDefs[i]"
          [procedureData]="procedureData"
          cdkDrag
          [cdkDragDisabled]="(!(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) || (isReadonly && !procedureData.redliningEnabled)) || !stepDragIsDone || stepGroup.editType === EditType.REDLINE_DELETE"
          [cdkDragData]="step"
          [run]="run"
          [blackliningEnabled]="blackliningEnabled && stepGroup.editType !== EditType.REDLINE_DELETE"
          [isVisible]="stepsVisible || disableStepPerformancePlaceholders"
          inViewport
          [inViewportOptions]="{ threshold: [0] }"
          (inViewportAction)="renderVisible($event)"
        >
          <div
            class="section-placeholder"
            *cdkDragPlaceholder
          ></div>
          <div
            class="section-preview"
            *cdkDragPreview
          ></div>
          <mat-icon
            slot="drag-handle"
            *ngIf="(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) && (!isReadonly || procedureData.redliningEnabled) && step.editType !== EditType.REDLINE_DELETE && stepDragIsDone"
            cdkDragHandle
            matTooltip="Click here to drag step to a new position in this group"
            class="dragHandle step-group-icon-align"
            aria-label="Click here to drag this step to a new position in this group"
          >drag_indicator
          </mat-icon>
        </app-proceduresteps>
      </div>
      <button
        mat-raised-button
        color="primary"
        *ngIf="(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) && (!isReadonly || procedureData.redliningEnabled) && stepGroup.editType !== EditType.REDLINE_DELETE"
        matTooltip="Adds a new step after the last step in this group."
        (click)="addStep()"
        aria-label="Add a new step to this group"
      >Add New Step
      </button>
      <!-- again, the id of this div is different from this step group's expansion panel id. The ID here is for using to connect step groups together so that dragging/dropping
		can be done across step groups. Do not mix the two ids up.  -->
      <div
        class="section-list flex-column justify-around items-stretch content-stretch"
        id="sg_{{stepGroup.pk}}"
        cdkDropList
        [cdkDropListData]="stepGroup.stepGroupDefsChildren"
        (cdkDropListDropped)="drop($event)"
      >
        <app-procedurestepgroups
          class="step-group-section-box"
          *ngFor="let subgroup of stepGroup.stepGroupDefsChildren; trackBy groupIdentity"
          [stepGroup]="subgroup"
          [myStepGroupParent]="stepGroup"
          [(procedureData)]="procedureData"
          [expandChildren]="expandChildren"
          cdkDrag
          [cdkDragDisabled]="(!(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) || (isReadonly && !procedureData.redliningEnabled)) || !groupDragIsDone || stepGroup.editType === EditType.REDLINE_DELETE"
          [isReadonly]="isReadonly || stepGroup.editType === EditType.REDLINE_DELETE"
          [blackliningEnabled]="blackliningEnabled"
          [cdkDragData]="subgroup"
          [run]="run"
          [disableStepPerformancePlaceholders]="disableStepPerformancePlaceholders"
          (childStepValueChanged)="onChildStepValueChanged()"
        >
          <div
            class="section-placeholder"
            *cdkDragPlaceholder
          ></div>
          <div
            class="section-preview"
            *cdkDragPreview
          ></div>

          <!-- the drag handle is here because cdkDragHandle and cdkDrag need to be in the same HTML file for the drag handle to work correctly. Look at the ng-content element
			above to see how that ties into this. -->
          <mat-icon
            slot="drag-handle"
            *ngIf="(procedureData | canEditProcedureOrRun: procedureData.redliningEnabled) && (!isReadonly || procedureData.redliningEnabled) && subgroup.editType !== EditType.REDLINE_DELETE && groupDragIsDone"
            cdkDragHandle
            class="dragHandle step-group-icon-align"
            matTooltip="Click here to drag group to a new position within this list"
            aria-label="Click here to drag this subgroup to a new position within this group"
          >drag_indicator
          </mat-icon>
        </app-procedurestepgroups>
      </div>
    </div>
  </ng-template>
</mat-expansion-panel>
