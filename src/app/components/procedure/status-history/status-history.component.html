<div>
  <mat-button-toggle id="display-history-button" class="history-toggle-button full-width" (change)="displayHistory = !displayHistory">{{(!displayHistory ? 'Display ' : 'Hide ')}}History</mat-button-toggle>
</div>
<div *ngIf="displayHistory" class="history-div full-width full-height flex-row xs:flex-column gap-10"
     >
  <div class="history-contents">
    <app-generic-comment-history-display [arrayOfCommentsOrHistories]="histories" [addBorder]="true" [titleText]=""></app-generic-comment-history-display>
  </div>
</div>
