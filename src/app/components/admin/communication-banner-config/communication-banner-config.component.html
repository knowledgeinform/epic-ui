<div>
  <div>
    <p>
      This feature is intended for use by the EPIC support team to post maintenance/urgent messages to users.
    </p>
  </div>
  <div *ngIf="communicationBanner !== undefined && communicationBanner.message !== undefined && communicationBanner.message.trim().length > 0"
       class="flex-row flex-no-wrap justify-content-center padding-top-10 padding-bottom-10">
    <div class="communication-banner" [style.padding]="'10px'"
         [ngClass]="
         {'background-info': communicationBanner.messageType === CommunicationBannerMessageType.INFO,
         'background-warning': communicationBanner.messageType === CommunicationBannerMessageType.WARNING,
         'background-error': communicationBanner.messageType === CommunicationBannerMessageType.ERROR,
         }">
      {{ communicationBanner.message }}
    </div>
  </div>

  <div class="flex-row flex-no-wrap justify-content-space-evenly padding-top-15">
    <div>
      <mat-form-field [style.width]="'40vw'">
        <mat-label>Banner Message</mat-label>
        <textarea matInput name="bannerText" placeholder="" [(ngModel)]="communicationBanner.message"></textarea>
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="outline" [style.width]="'20vw'">
        <mat-label>Message Type</mat-label>
        <mat-select [(ngModel)]="communicationBanner.messageType">
          <mat-option [value]="messageType"
                      *ngFor="let messageType of objectKeys(communicationBannerMessageType)">{{ messageType }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div>
      <mat-form-field [style.width]="'30vw'">
        <mat-label>Expiry Date (optional)...</mat-label>
        <input matInput type="date" [(ngModel)]="communicationBanner.expiry"/>
        <mat-hint>Banner will be removed after selected date</mat-hint>
      </mat-form-field>
    </div>
  </div>

  <div class="flex-row flex-no-wrap justify-content-start">
    <div class="padding-left-35">
      <button mat-raised-button color="primary" (click)="postBanner()"
              [disabled]="isNotValid()">
        Post Banner
      </button>
    </div>
    <div class="padding-left-10">
      <button mat-raised-button color="warn" (click)="removeBanner()">Remove Banner</button>
    </div>
  </div>
</div>
