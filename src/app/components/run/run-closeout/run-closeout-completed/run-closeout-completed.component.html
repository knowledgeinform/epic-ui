<fieldset class="epic-fieldset">
  <legend class="epic-fieldset">Close-out Approvers</legend>
  <mat-chip-listbox class="mat-chip-list-stacked">
    <ol>
      <li *ngFor="let approver of run.runApprovals">
        <mat-chip-option class="auto-width" selected [selectable]="false" [removable]="false" color="primary">
          {{approver.users.displayName}}</mat-chip-option>
      </li>
    </ol>
  </mat-chip-listbox>
</fieldset>
<div class="buttonDiv" *ngIf="jwtService.getCurrentUser().isAdmin">
  <button mat-raised-button color="warn" (click)="transitionToCorrectingStatus()">
    <mat-icon>{{RunStatus.CORRECTING | runStatusIcon}}</mat-icon> Return Run to Correcting Status</button>
  <div class="savingLabel flex-row justify-end items-stretch content-stretch" *ngIf="transitioningRun">
    Transitioning Run...
  </div>
</div>
